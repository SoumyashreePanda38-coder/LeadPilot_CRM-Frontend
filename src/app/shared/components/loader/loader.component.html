<div class="loader-overlay">

  <div class="loader-card">

    <!-- Animated Logo -->
    <div class="loader-logo-wrapper">

      <div class="loader-ring ring-one"></div>
      <div class="loader-ring ring-two"></div>

      <div class="loader-logo">
        <img
          src="assets/images/leadpilot-logo.png"
          alt="LeadPilot"
        >
      </div>

    </div>

    <!-- Brand -->
    <div class="loader-brand">
      <span>Lead</span><strong>Pilot</strong>
    </div>

    <!-- Loading Animation -->
    <div class="loader-line">
      <span></span>
    </div>

    <!-- Message -->
    <p class="loader-message">
      {{ message }}
    </p>

    <!-- Animated Dots -->
    <div class="loader-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </div>

</div>
