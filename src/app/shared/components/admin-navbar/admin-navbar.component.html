<nav class="admin-navbar">

    <!-- =====================================================
         LEFT SECTION
    ====================================================== -->

    <div class="navbar-left">

        <!-- Sidebar Toggle -->
        <button
            type="button"
            class="menu-btn"
            (click)="toggleSidebar()"
            title="Menu">

            <i class="bi bi-list"></i>

        </button>


        <!-- =================================================
             LEADPILOT LOGO
        ================================================== -->

        <div class="logo">

            <img
                src="assets/images/leadpilot-logo.png"
                alt="LeadPilot CRM"
                class="leadpilot-logo">

        </div>


        <!-- Brand -->
        <div class="brand">

            <h3>LeadPilot CRM</h3>

            <span>
                Customer Lead Management System
            </span>

        </div>

    </div>


    <!-- =====================================================
         SEARCH
    ====================================================== -->

    <div class="navbar-search">

        <div class="search-box">

            <i class="bi bi-search"></i>

            <input
                type="text"
                [(ngModel)]="searchText"
                (keyup.enter)="search()"
                placeholder="Search leads, categories, follow-ups..."
                autocomplete="off"
            />

            <button
                type="button"
                class="search-btn"
                (click)="search()"
                title="Search">

                <i class="bi bi-arrow-right"></i>

            </button>

        </div>

    </div>


    <!-- =====================================================
         RIGHT SECTION
    ====================================================== -->

    <div class="navbar-right">


        <!-- =================================================
             THEME
        ================================================== -->

        <button
            type="button"
            class="icon-btn"
            (click)="toggleTheme()"
            [title]="isDarkTheme ? 'Switch to Light Theme' : 'Switch to Dark Theme'">

            <i
                class="bi"
                [ngClass]="
                    isDarkTheme
                    ? 'bi-sun-fill'
                    : 'bi-moon-stars-fill'
                ">
            </i>

        </button>


        <!-- =================================================
             NOTIFICATIONS / REMINDERS
        ================================================== -->

        <button
            type="button"
            class="icon-btn notification-btn"
            routerLink="/admin/reminders"
            title="Reminders">

            <i class="bi bi-bell"></i>

            <!-- LIVE UNREAD REMINDER COUNT -->
            <span
                *ngIf="notificationCount > 0"
                class="notification-badge">

                {{ notificationCount }}

            </span>

        </button>


        <!-- =================================================
             PROFILE
        ================================================== -->

        <button
            type="button"
            class="icon-btn"
            routerLink="/admin/profile"
            title="My Profile">

            <i class="bi bi-person-circle"></i>

        </button>


        <!-- =================================================
             LOGOUT
        ================================================== -->

        <button
            type="button"
            class="logout-btn"
            (click)="logout()"
            title="Logout">

            <i class="bi bi-box-arrow-right"></i>

            <span class="logout-text">
                Logout
            </span>

        </button>

    </div>

</nav>
