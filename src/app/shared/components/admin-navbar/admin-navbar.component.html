<nav class="admin-navbar">

    <!-- Left Section -->

    <div class="navbar-left">

        <!-- Sidebar Toggle -->

        <button
            class="menu-btn"
            (click)="toggleSidebar()">

            <i class="bi bi-list"></i>

        </button>

        <!-- Logo -->

        <div class="logo">

            <i class="bi bi-graph-up-arrow"></i>

        </div>

        <!-- Brand -->

        <div class="brand">

            <h3>LeadPilot CRM</h3>
            <span>Customer Lead Management System</span>

        </div>

    </div>

    <!-- Search -->

    <div class="navbar-search">

        <div class="search-box">

            <i class="bi bi-search"></i>

            <input
                type="text"
                placeholder="Search..." />

        </div>

    </div>

    <!-- Right -->

    <div class="navbar-right">

        <!-- Theme -->

        <button
            class="icon-btn"
            (click)="toggleTheme()"
            title="Theme">

            <i
                class="bi"
                [ngClass]="isDarkTheme ? 'bi-sun-fill' : 'bi-moon-stars-fill'">
            </i>

        </button>

        <!-- Notifications -->

        <button
            class="icon-btn">

            <i class="bi bi-bell"></i>

        </button>

        <!-- User -->

        <button
            class="icon-btn">

            <i class="bi bi-person-circle"></i>

        </button>

        <!-- Logout -->

        <button
            class="logout-btn"
            (click)="logout()">

            <i class="bi bi-box-arrow-right"></i>

            <span class="logout-text">

                Logout

            </span>

        </button>

    </div>

</nav>
